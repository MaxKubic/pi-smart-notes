<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pi Smart Notes 🍓</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-4 md:p-8">

    <div class="max-w-4xl mx-auto space-y-6">
        <!-- Hlavička -->
        <header class="flex justify-between items-center border-b border-slate-800 pb-4">
            <h1 class="text-2xl font-bold text-pink-500 flex items-center gap-2">
                🍓 Pi Smart Notes
            </h1>
            <span class="text-xs bg-slate-800 px-3 py-1 rounded-full text-slate-400">RPi 4 Edition</span>
        </header>

        <!-- Blok pro vytváření poznámky -->
        <div class="bg-slate-800 rounded-xl p-4 shadow-lg border border-slate-700">
            <!-- Přepínání záložek: Text vs Malování vs To-Do -->
            <div class="flex flex-wrap gap-2 mb-4 border-b border-slate-700 pb-2">
                <button id="tab-text-btn" onclick="switchTab('text')" class="px-4 py-1.5 rounded-lg bg-pink-600 font-medium text-sm">✍️ Text</button>
                <button id="tab-todo-btn" onclick="switchTab('todo')" class="px-4 py-1.5 rounded-lg bg-slate-700 text-slate-300 font-medium text-sm hover:bg-slate-600">☑️ To-Do Úkol</button>
                <button id="tab-draw-btn" onclick="switchTab('draw')" class="px-4 py-1.5 rounded-lg bg-slate-700 text-slate-300 font-medium text-sm hover:bg-slate-600">🎨 Malování</button>
            </div>

            <!-- Formát 1: Textový vstup -->
            <div id="tab-text" class="space-y-3">
                <textarea id="note-input" rows="3" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-sm focus:outline-none focus:border-pink-500 placeholder-slate-500" placeholder="Napiš novou poznámku..."></textarea>
                <button onclick="saveTextNote()" class="bg-pink-600 hover:bg-pink-500 text-white px-4 py-2 rounded-lg text-sm font-semibold transition">Uložit poznámku</button>
            </div>

            <!-- Formát 2: To-Do vstup -->
            <div id="tab-todo" class="hidden space-y-3">
                <input id="todo-input" type="text" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-sm focus:outline-none focus:border-pink-500 placeholder-slate-500" placeholder="Co je potřeba udělat? (např. Koupit mléko)..." />
                <button onclick="saveTodoNote()" class="bg-pink-600 hover:bg-pink-500 text-white px-4 py-2 rounded-lg text-sm font-semibold transition">Přidat úkol</button>
            </div>

            <!-- Formát 3: Malování (Canvas) -->
            <div id="tab-draw" class="hidden space-y-3">
                <p class="text-xs text-slate-400">Nakresli nebo napiš cokoliv rukou/myší:</p>
                <div class="border border-slate-700 rounded-lg overflow-hidden bg-white">
                    <canvas id="paint-canvas" width="600" height="200" class="w-full touch-none cursor-crosshair"></canvas>
                </div>
                <div class="flex justify-between items-center">
                    <button onclick="clearCanvas()" class="text-xs text-slate-400 hover:text-red-400">Vymazat plátno</button>
                    <button onclick="saveDrawingNote()" class="bg-pink-600 hover:bg-pink-500 text-white px-4 py-2 rounded-lg text-sm font-semibold transition">Uložit kresbu</button>
                </div>
            </div>
        </div>

        <!-- Seznam poznámek a To-Do -->
        <main>
            <h2 class="text-lg font-semibold mb-4 text-slate-300">Moje Zápisky a Úkoly</h2>
            <div id="notes-list" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <!-- Sem se načtou položky -->
            </div>
        </main>
    </div>

    <script>
        let currentTab = 'text';

        function switchTab(tab) {
            currentTab = tab;
            document.getElementById('tab-text').classList.toggle('hidden', tab !== 'text');
            document.getElementById('tab-todo').classList.toggle('hidden', tab !== 'todo');
            document.getElementById('tab-draw').classList.toggle('hidden', tab !== 'draw');

            const activeClass = 'px-4 py-1.5 rounded-lg bg-pink-600 font-medium text-sm text-white';
            const inactiveClass = 'px-4 py-1.5 rounded-lg bg-slate-700 text-slate-300 font-medium text-sm hover:bg-slate-600';

            document.getElementById('tab-text-btn').className = tab === 'text' ? activeClass : inactiveClass;
            document.getElementById('tab-todo-btn').className = tab === 'todo' ? activeClass : inactiveClass;
            document.getElementById('tab-draw-btn').className = tab === 'draw' ? activeClass : inactiveClass;
        }

        async function fetchNotes() {
            const res = await fetch('/api/notes');
            const notes = await res.json();
            const container = document.getElementById('notes-list');
            container.innerHTML = '';

            notes.forEach(note => {
                const date = new Date(note.created_at).toLocaleString('cs-CZ');
                const card = document.createElement('div');
                card.className = "bg-slate-800 border border-slate-700 rounded-xl p-4 flex flex-col justify-between shadow";

                let contentHtml = '';

                if (note.type === 'drawing') {
                    contentHtml = `<img src="${note.content}" class="w-full h-auto bg-white rounded border border-slate-600 my-2" />`;
                } else if (note.type === 'todo') {
                    const isDone = note.completed;
                    contentHtml = `
                        <div class="flex items-center gap-3 my-3 cursor-pointer" onclick="toggleTodo('${note.id}')">
                            <input type="checkbox" ${isDone ? 'checked' : ''} class="w-5 h-5 accent-pink-500 cursor-pointer pointer-events-none" />
                            <span class="text-sm font-medium ${isDone ? 'line-through text-slate-500' : 'text-slate-200'}">${note.content}</span>
                        </div>
                    `;
                } else {
                    contentHtml = `<p class="text-slate-200 text-sm whitespace-pre-wrap my-2">${note.content}</p>`;
                }

                card.innerHTML = `
                    <div class="flex justify-between items-center text-xs text-slate-400 border-b border-slate-700/50 pb-2">
                        <span class="font-bold text-pink-400">${note.type.toUpperCase()}</span>
                        <span>${date}</span>
                    </div>
                    ${contentHtml}
                `;
                container.appendChild(card);
            });
        }

        async function saveTextNote() {
            const text = document.getElementById('note-input').value;
            if (!text.trim()) return;
            await fetch('/api/notes', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ content: text, type: 'text' })
            });
            document.getElementById('note-input').value = '';
            fetchNotes();
        }

        async function saveTodoNote() {
            const text = document.getElementById('todo-input').value;
            if (!text.trim()) return;
            await fetch('/api/notes', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ content: text, type: 'todo' })
            });
            document.getElementById('todo-input').value = '';
            fetchNotes();
        }

        async function toggleTodo(id) {
            await fetch('/api/notes/toggle/' + id, { method: 'POST' });
            fetchNotes();
        }

        // Canvas / Malování
        const canvas = document.getElementById('paint-canvas');
        const ctx = canvas.getContext('2d');
        let painting = false;

        ctx.lineWidth = 3;
        ctx.lineCap = 'round';
        ctx.strokeStyle = '#000000';

        function startPosition(e) { painting = true; draw(e); }
        function finishedPosition() { painting = false; ctx.beginPath(); }
        function draw(e) {
            if (!painting) return;
            const rect = canvas.getBoundingClientRect();
            const x = (e.clientX || (e.touches && e.touches[0].clientX)) - rect.left;
            const y = (e.clientY || (e.touches && e.touches[0].clientY)) - rect.top;

            ctx.lineTo(x, y);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(x, y);
        }

        canvas.addEventListener('mousedown', startPosition);
        canvas.addEventListener('mouseup', finishedPosition);
        canvas.addEventListener('mousemove', draw);
        canvas.addEventListener('touchstart', startPosition);
        canvas.addEventListener('touchend', finishedPosition);
        canvas.addEventListener('touchmove', draw);

        function clearCanvas() { ctx.clearRect(0, 0, canvas.width, canvas.height); }

        async function saveDrawingNote() {
            const dataURL = canvas.toDataURL();
            await fetch('/api/notes', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ content: dataURL, type: 'drawing' })
            });
            clearCanvas();
            fetchNotes();
        }

        fetchNotes();
    </script>
</body>
</html>
