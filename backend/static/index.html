<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pi Smart Notes 🍓</title>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Courier+Prime&family=Georgia&family=Inter:wght@400;600;700&family=Lora:ital,wght@0,400;0,700;1,400&family=Montserrat:wght@400;600;700&family=Open+Sans:wght@400;600;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

    <!-- Quill.js Editor (CSS a JS) -->
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
    <script src="https://cdn.quilljs.com/1.3.6/quill.min.js"></script>

    <!-- Tailwind & Lucide ikony -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <link rel="stylesheet" href="/css/style.css">

    <style>
        .ql-snow .ql-picker.ql-size .ql-picker-label::before,
        .ql-snow .ql-picker.ql-size .ql-picker-item::before { content: attr(data-value); }
        
        .ql-size-8px  { font-size: 8px; }
        .ql-size-10px { font-size: 10px; }
        .ql-size-12px { font-size: 12px; }
        .ql-size-14px { font-size: 14px; }
        .ql-size-16px { font-size: 16px; }
        .ql-size-18px { font-size: 18px; }
        .ql-size-24px { font-size: 24px; }
        .ql-size-32px { font-size: 32px; }
        .ql-size-48px { font-size: 48px; }
        .ql-size-72px { font-size: 72px; }

        .ql-font-roboto { font-family: 'Roboto', sans-serif; }
        .ql-font-open-sans { font-family: 'Open Sans', sans-serif; }
        .ql-font-montserrat { font-family: 'Montserrat', sans-serif; }
        .ql-font-lora { font-family: 'Lora', serif; }
        .ql-font-georgia { font-family: 'Georgia', serif; }
        .ql-font-courier { font-family: 'Courier Prime', monospace; }
        .ql-font-inter { font-family: 'Inter', sans-serif; }

        .paper-editor .ql-toolbar.ql-snow {
            background-color: #0f172a;
            border-color: #1e293b !important;
            border-top-left-radius: 0.5rem;
            border-top-right-radius: 0.5rem;
        }
        .paper-editor .ql-container.ql-snow {
            background-color: #ffffff !important;
            color: #0f172a !important;
            border-color: #cbd5e1 !important;
            border-bottom-left-radius: 0;
            border-bottom-right-radius: 0;
            font-size: 14px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }
        .ql-editor h1, .ql-editor h2, .ql-editor h3 { display: block; }
        .ql-editor ol, .ql-editor ul { padding-left: 1.5em; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 h-screen overflow-hidden font-sans">

    <div class="flex h-full relative">

        <!-- LEVÝ PANEL (SIDEBAR) -->
        <aside id="main-sidebar" class="w-80 bg-slate-900 border-r border-slate-800 flex flex-col justify-between p-4 flex-shrink-0 transition-all duration-300 ease-in-out relative z-30">
            <div class="space-y-6 overflow-y-auto pr-1">
                
                <!-- LOGO A TLAČÍTKO SCHOVÁNÍ -->
                <div class="flex items-center justify-between px-2 py-1">
                    <div class="flex items-center gap-3">
                        <div class="w-9 h-9 bg-pink-600 rounded-xl flex items-center justify-center font-bold text-lg shadow-lg shadow-pink-500/20">🍓</div>
                        <div>
                            <h1 class="font-bold text-base leading-none text-slate-100">Pi Smart Notes</h1>
                            <span class="text-[10px] text-pink-400 font-medium">Raspberry Pi OS</span>
                        </div>
                    </div>
                    <button onclick="toggleSidebar()" class="text-slate-400 hover:text-pink-400 p-1 rounded-lg hover:bg-slate-800 transition" title="Skrýt panel">
                        <i data-lucide="panel-left-close" class="w-5 h-5"></i>
                    </button>
                </div>

                <!-- SEKCE 0: PROJEKTY / PAGES -->
                <div class="space-y-2">
                    <div class="flex items-center justify-between text-slate-400 px-2">
                        <span class="text-xs font-bold tracking-wider uppercase flex items-center gap-1.5"><i data-lucide="layout" class="w-4 h-4 text-pink-500"></i> A4 Projekty & Pages</span>
                        <button onclick="createNew('project_page')" class="hover:bg-slate-800 p-1 rounded text-slate-300 hover:text-pink-400 transition" title="Nový Projekt"><i data-lucide="plus" class="w-4 h-4"></i></button>
                    </div>
                    <div id="sidebar-projects" class="space-y-1"></div>
                </div>

                <!-- SEKCE 1: AUDIO -->
                <div class="space-y-2">
                    <div class="flex items-center justify-between text-slate-400 px-2">
                        <span class="text-xs font-bold tracking-wider uppercase flex items-center gap-1.5"><i data-lucide="mic" class="w-4 h-4 text-red-500"></i> Hlasové Záznamy</span>
                        <button onclick="createNew('audio')" class="hover:bg-slate-800 p-1 rounded text-slate-300 hover:text-red-400 transition" title="Nová nahrávka"><i data-lucide="plus" class="w-4 h-4"></i></button>
                    </div>
                </div>

                <!-- SEKCE 2: TO-DO TABLES -->
                <div class="space-y-2">
                    <div class="flex items-center justify-between text-slate-400 px-2">
                        <span class="text-xs font-bold tracking-wider uppercase flex items-center gap-1.5"><i data-lucide="table" class="w-4 h-4 text-pink-500"></i> Custom Tabulky</span>
                        <button onclick="createNew('todo_table')" class="hover:bg-slate-800 p-1 rounded text-slate-300 hover:text-pink-400 transition" title="Nová Tabulka"><i data-lucide="plus" class="w-4 h-4"></i></button>
                    </div>
                    <div id="sidebar-todos" class="space-y-1"></div>
                </div>

                <!-- SEKCE 3: NOTES + OCR CAMERA BUTTON -->
                <div class="space-y-2">
                    <div class="flex items-center justify-between text-slate-400 px-2">
                        <span class="text-xs font-bold tracking-wider uppercase flex items-center gap-1.5"><i data-lucide="file-text" class="w-4 h-4 text-pink-500"></i> Poznámky a Přepisy</span>
                        <div class="flex gap-1">
                            <button onclick="createNew('ocr')" class="hover:bg-slate-800 p-1 rounded text-slate-300 hover:text-pink-400 transition" title="Skenovat fotku / OCR"><i data-lucide="camera" class="w-4 h-4"></i></button>
                            <button onclick="createNew('text')" class="hover:bg-slate-800 p-1 rounded text-slate-300 hover:text-pink-400 transition" title="Nová poznámka"><i data-lucide="plus" class="w-4 h-4"></i></button>
                        </div>
                    </div>
                    <div id="sidebar-notes" class="space-y-1"></div>
                </div>

                <!-- SEKCE 4: SKETCHES -->
                <div class="space-y-2">
                    <div class="flex items-center justify-between text-slate-400 px-2">
                        <span class="text-xs font-bold tracking-wider uppercase flex items-center gap-1.5"><i data-lucide="palette" class="w-4 h-4 text-pink-500"></i> Kresby</span>
                        <button onclick="createNew('drawing')" class="hover:bg-slate-800 p-1 rounded text-slate-300 hover:text-pink-400 transition" title="Nová kresba"><i data-lucide="plus" class="w-4 h-4"></i></button>
                    </div>
                    <div id="sidebar-sketches" class="grid grid-cols-2 gap-2 pt-1"></div>
                </div>

            </div>
        </aside>

        <!-- PRAVÁ PRACOVNÍ PLOCHA -->
        <main class="flex-1 bg-slate-950 p-6 overflow-y-auto flex flex-col justify-center items-center relative w-full h-full">
            <button id="btn-open-sidebar" onclick="toggleSidebar()" class="hidden absolute top-4 left-4 z-40 bg-slate-900 border border-slate-800 hover:border-pink-500/50 text-slate-300 hover:text-pink-400 p-2 rounded-xl shadow-xl transition flex items-center gap-2 text-xs font-semibold">
                <i data-lucide="panel-left-open" class="w-4 h-4"></i> Menu
            </button>

            <div id="work-container" class="w-full h-full flex flex-col justify-center items-center">
                <div class="text-center text-slate-600 space-y-3">
                    <i data-lucide="layout-dashboard" class="w-16 h-16 mx-auto stroke-1"></i>
                    <p class="text-sm font-medium">Vyber věc z levého menu nebo vytvoř novou kliknutím na <span class="text-pink-500 font-bold">+</span></p>
                </div>
            </div>
        </main>

    </div>

    <!-- MODAL OKNO PRO PŘIDÁNÍ SLOUPCE V TABULCE -->
    <div id="modal-add-column" class="hidden fixed inset-0 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center z-50">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 w-full max-w-md space-y-4 shadow-2xl">
            <h3 class="text-lg font-bold text-slate-100 flex items-center gap-2">
                <i data-lucide="columns-3" class="w-5 h-5 text-pink-500"></i> Přidat Nový Sloupec
            </h3>
            
            <div class="space-y-3">
                <div>
                    <label class="text-xs font-semibold text-slate-400 uppercase tracking-wider block mb-1">Název sloupce</label>
                    <input type="text" id="new-col-name" placeholder="např. Priorita, Cena, Splněno..." class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-pink-500" />
                </div>
                <div>
                    <label class="text-xs font-semibold text-slate-400 uppercase tracking-wider block mb-1">Datový Typ</label>
                    <select id="new-col-type" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-pink-500">
                        <option value="text">🔤 Text</option>
                        <option value="checkbox">☑️ Zaškrtávátko (Checkbox)</option>
                        <option value="date">📅 Datum</option>
                        <option value="number">🔢 Číslo</option>
                    </select>
                </div>
            </div>

            <div class="flex justify-end gap-2 pt-2">
                <button onclick="closeAddColumnModal()" class="px-4 py-2 text-xs font-semibold text-slate-400 hover:text-slate-200 transition">Zrušit</button>
                <button onclick="confirmAddColumn()" class="bg-pink-600 hover:bg-pink-500 px-4 py-2 rounded-xl text-xs font-semibold text-white transition">Přidat Sloupec</button>
            </div>
        </div>
    </div>

    <!-- MODAL OKNO PRO VÝBĚR BLOKŮ DO A4 STRÁNKY -->
    <div id="modal-add-widget" class="hidden fixed inset-0 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center z-50">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 w-full max-w-lg space-y-4 shadow-2xl">
            <h3 class="text-lg font-bold text-slate-100 flex items-center gap-2">
                <i data-lucide="plus-circle" class="w-5 h-5 text-pink-500"></i> Vložit prvek na A4 Stránku
            </h3>

            <!-- RYCHLÁ TLAČÍTKA PRO PROJEKTOVOU VYTVOŘENÍ -->
            <div class="grid grid-cols-3 gap-2 pb-2 border-b border-slate-800">
                <button id="btn-create-inline-text" class="bg-pink-600/10 hover:bg-pink-600/20 border border-pink-500/30 text-pink-400 font-semibold py-2 px-2 rounded-xl text-xs flex items-center justify-center gap-1.5 transition">
                    <i data-lucide="file-text" class="w-4 h-4"></i> + Text
                </button>
                <button id="btn-create-inline-table" class="bg-pink-600/10 hover:bg-pink-600/20 border border-pink-500/30 text-pink-400 font-semibold py-2 px-2 rounded-xl text-xs flex items-center justify-center gap-1.5 transition">
                    <i data-lucide="table" class="w-4 h-4"></i> + Tabulka
                </button>
                <button id="btn-create-inline-drawing" class="bg-pink-600/10 hover:bg-pink-600/20 border border-pink-500/30 text-pink-400 font-semibold py-2 px-2 rounded-xl text-xs flex items-center justify-center gap-1.5 transition">
                    <i data-lucide="palette" class="w-4 h-4"></i> + Kresba
                </button>
            </div>
            
            <p class="text-xs text-slate-400">Nebo vyber existující položku ze seznamu:</p>
            
            <div id="widget-select-list" class="max-h-60 overflow-y-auto space-y-2 pr-1 border border-slate-800 rounded-xl p-2 bg-slate-950">
            </div>

            <div class="flex justify-end gap-2 pt-2">
                <button onclick="closeAddWidgetModal()" class="px-4 py-2 text-xs font-semibold text-slate-400 hover:text-slate-200 transition">Zavřít</button>
            </div>
        </div>
    </div>

    <!-- SKRIPTY PROPOJENÉ Z EXTERNÍCH SOUBORŮ -->
    <script src="/js/tables.js"></script>
    <script src="/js/canvas.js"></script>
    <script src="/js/media.js"></script>
    <script src="/js/app.js"></script>
</body>
</html>
